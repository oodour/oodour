name: Mutation testing

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: The commit, branch or tag to test. Empty tests the branch the run starts from.
        type: string

permissions:
  contents: read

# A newer push to a branch or pull request replaces its run, as the runs are costly. A run started by hand is never
# replaced, so it gives a result for the one commit it names.
concurrency:
  group: mutation-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  # One job per Stryker configuration, side by side. Each runs lz-node-test's node:test runner, which runs per mutant only
  # the tests that reach it; Stryker's command runner runs every suite for each mutant and mostly times out here. The
  # runner loads from the source of a checkout at a pinned commit, beside this repository's checkout so that Stryker's
  # sandbox does not copy it. The runner has four cores and nothing else to leave one free for, so the run takes all four
  # where the configurations' own formula would take three.
  #
  # No job may take more than 15 minutes, so a configuration that would is shared out between file sets. Each set's
  # last pattern group takes whatever the others leave, so a new file always lands in one of them.
  stryker:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: tooling
            config: stryker.config.ts
          # Six of the scripts' tests run on Windows only (drive and network paths) and none off Windows only, so the
          # scripts reach their score there. As one job they took 44 minutes.
          - target: scripts-a-c
            config: stryker.oodour-scripts.config.ts
            os: windows-latest
            mutate: plugins/oodour/scripts/[a-c]*.ts,!plugins/oodour/scripts/*.test.ts
          - target: scripts-d-f
            config: stryker.oodour-scripts.config.ts
            os: windows-latest
            mutate: plugins/oodour/scripts/[d-f]*.ts,!plugins/oodour/scripts/*.test.ts,!plugins/oodour/scripts/fixtures.ts
          - target: scripts-g
            config: stryker.oodour-scripts.config.ts
            os: windows-latest
            mutate: plugins/oodour/scripts/g*.ts,!plugins/oodour/scripts/*.test.ts
          - target: scripts-h-l
            config: stryker.oodour-scripts.config.ts
            os: windows-latest
            mutate: plugins/oodour/scripts/[h-l]*.ts,!plugins/oodour/scripts/*.test.ts
          - target: scripts-metadata
            config: stryker.oodour-scripts.config.ts
            os: windows-latest
            mutate: plugins/oodour/scripts/metadata.ts
          - target: scripts-rest
            config: stryker.oodour-scripts.config.ts
            os: windows-latest
            mutate: plugins/oodour/scripts/[!a-l]*.ts,!plugins/oodour/scripts/metadata.ts,!plugins/oodour/scripts/*.test.ts
          # The core took 19 minutes as one job.
          - target: core-metrics-a-f
            config: stryker.core.config.ts
            mutate: packages/core/src/metrics/[a-f]*.ts,!packages/core/src/**/*.test.ts
          - target: core-metrics-g-z
            config: stryker.core.config.ts
            mutate: packages/core/src/metrics/[!a-f]*.ts,!packages/core/src/**/*.test.ts
          - target: core-rest
            config: stryker.core.config.ts
            mutate: packages/core/src/**/*.ts,!packages/core/src/metrics/**,!packages/core/src/**/*.test.ts
          # The ESLint package took 37 minutes as one job: its mutants run 58 tests each on average, where the other
          # jobs' run 11 to 14.
          - target: eslint-plugin-rules-a-d
            config: stryker.eslint-plugin.config.ts
            mutate: packages/eslint-plugin/src/rules/[a-d]*.ts,!packages/eslint-plugin/src/**/*.test.ts
          - target: eslint-plugin-rules-e-i
            config: stryker.eslint-plugin.config.ts
            mutate: packages/eslint-plugin/src/rules/[e-i]*.ts,!packages/eslint-plugin/src/**/*.test.ts
          - target: eslint-plugin-rules-j-m
            config: stryker.eslint-plugin.config.ts
            mutate: packages/eslint-plugin/src/rules/[j-m]*.ts,!packages/eslint-plugin/src/**/*.test.ts
          - target: eslint-plugin-rules-n-z
            config: stryker.eslint-plugin.config.ts
            mutate: packages/eslint-plugin/src/rules/[!a-m]*.ts,!packages/eslint-plugin/src/**/*.test.ts
          - target: eslint-plugin-rest
            config: stryker.eslint-plugin.config.ts
            mutate: packages/eslint-plugin/src/**/*.ts,!packages/eslint-plugin/src/rules/**,!packages/eslint-plugin/src/**/*.test.ts
          - target: test-metrics
            config: stryker.test-metrics.config.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: oodour
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LayZeeDK/lz-node-test
          ref: aa3bc1b696beeab74da943b50ef31de1ac797351
          path: lz-node-test
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            oodour/package-lock.json
            lz-node-test/package-lock.json
      - run: npm ci
        working-directory: lz-node-test
      - run: npm ci
        working-directory: oodour
      - run: >-
          node --conditions=@oodour/source --conditions=@layzee/source
          node_modules/@stryker-mutator/core/bin/stryker.js run ${{ matrix.config }} --concurrency 4
          ${MUTATE:+--mutate "$MUTATE"}
        working-directory: oodour
        env:
          MUTATE: ${{ matrix.mutate }}
          LZ_NODE_TEST_RUNNER: ${{ github.workspace }}/lz-node-test/packages/stryker-node-test-runner/src/index.ts
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ matrix.target }}
          path: oodour/reports/mutation/
          if-no-files-found: error
