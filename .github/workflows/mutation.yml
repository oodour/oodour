name: Mutation testing

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its run. On main every push keeps its own run, so each commit gets a result.
concurrency:
  group: mutation-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # One job per Stryker configuration, side by side. Each runs lz-node-test's node:test runner, which runs per mutant only
  # the tests that reach it; Stryker's command runner runs every suite for each mutant and mostly times out here. The
  # runner loads from the source of a checkout at a pinned commit, beside this repository's checkout so that Stryker's
  # sandbox does not copy it. The runner has four cores and nothing else to leave one free for, so the run takes all four
  # where the configurations' own formula would take three.
  stryker:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: tooling
            config: stryker.config.ts
          - target: scripts
            config: stryker.oodour-scripts.config.ts
          - target: core
            config: stryker.core.config.ts
          # The ESLint package took 37 minutes as one job: its mutants run 58 tests each on average, where the other
          # jobs' run 11 to 14. Three file sets share it out. The second is everything in rules/ the first leaves, and
          # the third everything outside rules/, so a new file always lands in one of them.
          - target: eslint-plugin-rules-a-i
            config: stryker.eslint-plugin.config.ts
            mutate: packages/eslint-plugin/src/rules/[a-i]*.ts,!packages/eslint-plugin/src/**/*.test.ts
          - target: eslint-plugin-rules-j-z
            config: stryker.eslint-plugin.config.ts
            mutate: packages/eslint-plugin/src/rules/[!a-i]*.ts,!packages/eslint-plugin/src/**/*.test.ts
          - target: eslint-plugin-rest
            config: stryker.eslint-plugin.config.ts
            mutate: packages/eslint-plugin/src/**/*.ts,!packages/eslint-plugin/src/rules/**,!packages/eslint-plugin/src/**/*.test.ts
          - target: test-metrics
            config: stryker.test-metrics.config.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: oodour
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LayZeeDK/lz-node-test
          ref: aa3bc1b696beeab74da943b50ef31de1ac797351
          path: lz-node-test
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            oodour/package-lock.json
            lz-node-test/package-lock.json
      - run: npm ci
        working-directory: lz-node-test
      - run: npm ci
        working-directory: oodour
      - run: >-
          node --conditions=@oodour/source --conditions=@layzee/source
          node_modules/@stryker-mutator/core/bin/stryker.js run ${{ matrix.config }} --concurrency 4
          ${MUTATE:+--mutate "$MUTATE"}
        working-directory: oodour
        env:
          MUTATE: ${{ matrix.mutate }}
          LZ_NODE_TEST_RUNNER: ${{ github.workspace }}/lz-node-test/packages/stryker-node-test-runner/src/index.ts
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ matrix.target }}
          path: oodour/reports/mutation/
          if-no-files-found: error
