name: Mutation testing

# Manual runs only: a run takes about an hour.
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to mutate
        type: choice
        options: [tooling, core]
        default: tooling

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  tooling:
    if: inputs.target == 'tooling'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Stryker's dry run runs the whole tooling suite first and skips the tests that read the git-ignored sealed store.
      - run: node node_modules/@stryker-mutator/core/bin/stryker.js run stryker.config.ts --concurrency 4
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore

  # The core's run needs lz-node-test's runner, which runs per mutant only the tests that reach it; with Stryker's
  # command runner it would run every suite for each of some 2,500 mutants. The runner loads from the source of a
  # checkout at a pinned commit, beside this repository's checkout so that Stryker's sandbox does not copy it.
  core:
    if: inputs.target == 'core'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: oodour
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LayZeeDK/lz-node-test
          ref: aa3bc1b696beeab74da943b50ef31de1ac797351
          path: lz-node-test
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            oodour/package-lock.json
            lz-node-test/package-lock.json
      - run: npm ci
        working-directory: lz-node-test
      - run: npm ci
        working-directory: oodour
      - run: >-
          node --conditions=@oodour/source --conditions=@layzee/source
          node_modules/@stryker-mutator/core/bin/stryker.js run stryker.core.config.ts --concurrency 4
        working-directory: oodour
        env:
          LZ_NODE_TEST_RUNNER: ${{ github.workspace }}/lz-node-test/packages/stryker-node-test-runner/src/index.ts
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-core
          path: oodour/reports/mutation/
          if-no-files-found: ignore
