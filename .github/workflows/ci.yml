name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request replaces its run. On main every push keeps its own run, so each commit gets a result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # `npm run check:ci` is `npm run check` less what a clean clone cannot run: the overlap check and one tooling test read
  # the git-ignored store, and each mod's `register` module type-checks and lints against declarations that only a Claude
  # Code session writes. Mutation testing has its own workflow.
  check:
    name: check (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The `validate` and `test-mods` targets run `claude plugin validate` and `claude plugin test`.
      - run: npm install --global @anthropic-ai/claude-code@2.1.327
      - run: npm run check:ci
