name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What `npm run check` runs, less what a clean clone cannot: the overlap check and one tooling test read the git-ignored
  # store, and the two mods' hooks type-check and lint against declarations that only a Claude Code session writes. The
  # `ci` configuration of the tooling targets leaves those out. Mutation testing has its own workflow.
  check:
    name: check (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The `validate` and `test-mods` targets run `claude plugin validate` and `claude plugin test`.
      - run: npm install --global @anthropic-ai/claude-code@2.1.327
      - run: npm exec -- nx run-many -t typecheck lint test test-mods validate citations --configuration=ci
      - run: npm exec -- nx format:check --all
