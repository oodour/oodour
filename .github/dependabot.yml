version: 2
updates:
  # The actions the workflows pin by commit. The lz-node-test commit and the Claude Code version in the workflows are
  # updated by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One pull request a week for every action, since each runs the whole mutation matrix.
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
